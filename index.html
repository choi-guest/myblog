<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/list.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

  <div class="layout">
    <header class="sidebar">
      <a class="logo" href="index.html"><span class="logo-mark" aria-hidden="true">&gt;_</span>MY BLOG</a>
      <p class="tagline">마크다운으로 쓰는 개인 블로그</p>

      <div class="side-section" data-tag-section hidden>
        <p class="side-label">태그</p>
        <nav class="tag-filter" aria-label="태그 필터" data-tag-filter></nav>
      </div>
    </header>

    <main id="main-content" class="content">
      <p class="eyebrow">~/posts</p>
      <h1 class="page-title">최근 글</h1>
      <ul class="post-list" data-post-list>
        <li class="notice">불러오는 중…</li>
      </ul>

      <footer class="site-footer">© 2026 My Blog</footer>
    </main>
  </div>
</body>
</html>
