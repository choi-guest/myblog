<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <script>
    // 화면을 그리기 전에 저장된 테마를 적용해 깜빡임을 막는다
    try {
      const saved = localStorage.getItem('theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/list.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <nav class="site-nav" aria-label="사이트 메뉴">
        <a href="sudoku/">스도쿠</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="테마 전환">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </div>
  </header>

  <main id="main-content" class="container">
    <h1 class="page-title">글 목록</h1>
    <nav class="tag-filter" aria-label="태그 필터" data-tag-filter hidden></nav>
    <ul class="post-list" data-post-list>
      <li class="notice">불러오는 중…</li>
    </ul>

    <section class="app-section" aria-labelledby="app-section-title">
      <h2 class="section-title" id="app-section-title">웹앱</h2>
      <ul class="app-list">
        <li>
          <a class="app-card" href="apps/element-alchemy/">
            <img class="app-card-thumb" src="apps/element-alchemy/preview.svg" alt="원소 타일이 놓인 5×5 연금술 게임판" width="96" height="96">
            <span class="app-card-body">
              <span class="app-card-title">원소 연금술</span>
              <span class="app-card-desc">물·불·흙·바람을 밀어 합쳐 증기·용암을 만들고, 현자의 돌을 완성하는 슬라이딩 퍼즐</span>
            </span>
          </a>
        </li>
        <li>
          <a class="app-card" href="apps/starfighter/">
            <img class="app-card-thumb" src="apps/starfighter/preview.svg" alt="도형 모양 적 편대를 향해 탄을 쏘는 전투기" width="96" height="96">
            <span class="app-card-body">
              <span class="app-card-title">스타파이터</span>
              <span class="app-card-desc">보조 무기를 골라 출격해 도형 기계 편대를 격추하는 10단계 아케이드 슈팅</span>
            </span>
          </a>
        </li>
        <li>
          <a class="app-card" href="apps/invitation/">
            <img class="app-card-thumb" src="apps/invitation/preview.svg" alt="하트가 그려진 초대장 봉투" width="96" height="96">
            <span class="app-card-body">
              <span class="app-card-title">모바일 초대장</span>
              <span class="app-card-desc">행사까지 남은 시간을 보여 주는 D-Day와 카카오맵 오시는 길을 담은 휴대폰용 초대장</span>
            </span>
          </a>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 My Blog</div>
  </footer>
</body>
</html>
