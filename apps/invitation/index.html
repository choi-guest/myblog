<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>철수 ♥ 영희 결혼합니다</title>
  <meta name="description" content="2026년 12월 12일 토요일 낮 12시, 메리빌리아 송도">
  <meta name="theme-color" content="#f7f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1a17" media="(prefers-color-scheme: dark)">
  <!-- 공유 미리보기: 카카오톡·문자 미리보기는 절대 주소여야 한다. 배포 주소가 바뀌면 함께 바꾼다 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://choi-guest.github.io/myblog/apps/invitation/">
  <meta property="og:title" content="철수 ♥ 영희 결혼합니다">
  <meta property="og:description" content="2026년 12월 12일 토요일 낮 12시, 메리빌리아 송도">
  <meta property="og:image" content="https://choi-guest.github.io/myblog/apps/invitation/images/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="card">
    <header class="cover" data-cover>
      <div class="cover-inner">
        <p class="cover-type" data-field="type"></p>
        <h1 class="cover-title" data-field="title"></h1>
        <p class="cover-sub" data-field="subtitle"></p>
        <p class="cover-date" data-field="date"></p>
        <p class="cover-venue" data-field="venue-full"></p>
      </div>
      <span class="scroll-hint" aria-hidden="true">↓</span>
    </header>

    <section class="section reveal" aria-labelledby="greeting-title">
      <h2 class="section-title" id="greeting-title">초대합니다</h2>
      <div class="greeting" data-greeting></div>
      <p class="hosts" data-field="hosts"></p>
    </section>

    <section class="section reveal" aria-labelledby="date-title">
      <h2 class="section-title" id="date-title">일시</h2>
      <p class="date-text" data-field="date"></p>
      <div class="dday">
        <p class="dday-label" data-dday-label aria-live="polite"></p>
        <p class="dday-text" data-dday-text></p>
        <div class="countdown" data-countdown>
          <span class="count-box"><b data-count="days">0</b><small>일</small></span>
          <span class="count-box"><b data-count="hours">0</b><small>시간</small></span>
          <span class="count-box"><b data-count="minutes">0</b><small>분</small></span>
          <span class="count-box"><b data-count="seconds">0</b><small>초</small></span>
        </div>
      </div>
      <div class="calendar" data-calendar>
        <p class="calendar-title" data-calendar-title></p>
        <table class="calendar-table">
          <thead><tr data-calendar-head></tr></thead>
          <tbody data-calendar-body></tbody>
        </table>
      </div>
    </section>

    <section class="section reveal" aria-labelledby="map-title">
      <h2 class="section-title" id="map-title">오시는 길</h2>
      <p class="venue-name" data-field="venue-full"></p>
      <p class="venue-address" data-field="address"></p>
      <div class="map-wrap">
        <div class="map" data-map role="region" aria-label="행사장 위치 지도"></div>
        <div class="map-fallback" data-map-fallback hidden></div>
        <button class="map-toggle" type="button" data-map-toggle aria-pressed="false" hidden>지도 움직이기</button>
      </div>
      <div class="button-row">
        <a class="btn" data-link="kakao" target="_blank" rel="noopener">카카오맵 길찾기</a>
        <a class="btn" data-link="naver" target="_blank" rel="noopener">네이버 지도</a>
        <button class="btn" type="button" data-copy-address>주소 복사</button>
      </div>
      <dl class="transport" data-transport></dl>
    </section>

    <section class="section reveal" aria-labelledby="contact-title" data-contact-section>
      <h2 class="section-title" id="contact-title">연락하기</h2>
      <ul class="contacts" data-contacts></ul>
    </section>

    <section class="section reveal" aria-labelledby="share-title">
      <h2 class="section-title" id="share-title">초대장 보내기</h2>
      <div class="button-row">
        <button class="btn" type="button" data-copy-link>링크 복사</button>
        <button class="btn" type="button" data-share hidden>공유하기</button>
      </div>
    </section>

    <footer class="footer">
      <p>함께해 주셔서 감사합니다</p>
    </footer>
  </main>

  <p class="toast" data-toast role="status" aria-live="polite"></p>
</body>
</html>
