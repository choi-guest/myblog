<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>원소 연금술</title>
  <meta name="description" content="물·불·흙·바람을 밀어 합쳐 증기·용암을 만들고, 현자의 돌을 완성하는 슬라이딩 퍼즐">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="preview.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">원소 연금술</h1>
    <nav class="header-actions" aria-label="게임 메뉴">
      <button type="button" id="new-game" class="btn btn-primary">새 게임</button>
      <a class="btn btn-link" href="../../index.html">블로그로</a>
    </nav>
  </header>

  <main class="layout">
    <section class="play" aria-label="게임">
      <div class="scoreboard">
        <div class="stat">
          <span class="stat-label">점수</span>
          <span class="stat-value" id="score">0</span>
          <span class="score-gain" id="score-gain" aria-hidden="true"></span>
        </div>
        <div class="stat">
          <span class="stat-label">최고 점수</span>
          <span class="stat-value" id="best">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">턴</span>
          <span class="stat-value" id="turn">0</span>
        </div>
      </div>

      <div class="next-queue">
        <span class="next-title">다음 원소</span>
        <div class="queue-item">
          <span class="queue-label">다음</span>
          <div class="queue-slot" id="next-0" role="img" aria-label="없음"></div>
        </div>
        <div class="queue-item">
          <span class="queue-label">그다음</span>
          <div class="queue-slot" id="next-1" role="img" aria-label="없음"></div>
        </div>
      </div>

      <div class="board" id="board" role="grid" tabindex="0" aria-label="연금술 작업대, 5행 5열" aria-describedby="controls-hint"></div>

      <p class="status-line" id="status" role="status" aria-live="polite"></p>

      <p class="controls-hint" id="controls-hint">방향키·WASD 또는 스와이프로 밀기</p>
      <div class="dpad" role="group" aria-label="방향 버튼">
        <button type="button" class="btn dpad-btn dpad-up" data-dir="up" aria-label="위로 밀기">▲</button>
        <button type="button" class="btn dpad-btn dpad-left" data-dir="left" aria-label="왼쪽으로 밀기">◀</button>
        <button type="button" class="btn dpad-btn dpad-down" data-dir="down" aria-label="아래로 밀기">▼</button>
        <button type="button" class="btn dpad-btn dpad-right" data-dir="right" aria-label="오른쪽으로 밀기">▶</button>
      </div>
    </section>

    <aside class="codex-panel" aria-labelledby="codex-title">
      <h2 class="codex-heading" id="codex-title">조합 도감 <span class="codex-count" id="codex-count">0/11</span></h2>
      <p class="codex-note">같은 등급끼리만 반응합니다. 같은 원소는 등급이 오르고, 등급 Ⅴ 두 개는 승화해 사라집니다.</p>
      <ul class="codex" id="codex-list"></ul>
    </aside>
  </main>

  <footer class="site-footer">
    <p>원소 연금술 · 순수 HTML·CSS·JavaScript</p>
  </footer>

  <dialog id="result-dialog" class="result-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title" class="dialog-title"></h2>
    <div id="dialog-body" class="dialog-body"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </dialog>
</body>
</html>
